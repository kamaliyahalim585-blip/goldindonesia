<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1B14"/>
      <stop offset="100%" stop-color="#0F0E0D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Gold Emblem / Ingot Motif -->
  <g transform="translate(60, 60)" filter="url(#glow)">
    <!-- Trapezoid Gold Bar Base -->
    <path d="M 64 250 L 110 140 L 282 140 L 328 250 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <path d="M 110 140 L 140 100 L 252 100 L 282 140 Z" fill="#FFF3B0" opacity="0.75"/>
    <path d="M 282 140 L 252 100 L 298 200 L 328 250 Z" fill="#997A15" opacity="0.8"/>

    <!-- Gold Stacks Foreground -->
    <rect x="76" y="235" width="240" height="28" rx="8" fill="url(#goldGrad)"/>
    <rect x="76" y="235" width="240" height="12" rx="6" fill="url(#shineGrad)"/>

    <!-- Purity Mark & Text -->
    <text x="196" y="210" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#1C180A" text-anchor="middle" letter-spacing="4">INDOGOLD</text>
    <text x="196" y="230" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#3D3008" text-anchor="middle" letter-spacing="2">FINE GOLD 999.9</text>
  </g>

  <!-- Luxury Stars -->
  <polygon points="256,40 262,54 276,56 266,66 268,80 256,72 244,80 246,66 236,56 250,54" fill="url(#goldGrad)"/>
</svg>
